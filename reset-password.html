<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сброс пароля – Кондитерская фабрика</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .reset-page .container {
            max-width: 500px;
            margin: 100px auto 40px;
            padding: 30px;
            background: white;
            border: 1px solid #ddd;
        }
        .reset-page h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--color-dark);
        }
        .reset-page input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            font-family: inherit;
        }
        .reset-page button {
            background: var(--color-red);
            color: white;
            border: none;
            padding: 12px 20px;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
            font-size: 1rem;
        }
        .reset-page button:hover {
            background: #b30000;
        }
        .message {
            padding: 10px;
            margin: 10px 0;
            border: 1px solid;
            display: none;
        }
        .message.success {
            background: #d1fae5;
            color: #059669;
            border-color: #059669;
        }
        .message.error {
            background: #fee2e2;
            color: #dc2626;
            border-color: #dc2626;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 15px;
            color: var(--color-red);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <header></header>

    <main class="reset-page">
        <div class="container">
            <div id="resetFormContainer">
                <h1>Сброс пароля</h1>
                <div id="resetMessage" class="message"></div>
                <div id="loadingIndicator" class="loading" style="display: none;">Проверка ссылки...</div>
                
                <form id="resetForm" style="display: none;">
                    <input type="password" id="newPassword" placeholder="Новый пароль" required minlength="4">
                    <input type="password" id="confirmPassword" placeholder="Подтвердите пароль" required>
                    <button type="submit">Сохранить пароль</button>
                </form>
            </div>
            <a href="account.html" class="back-link">← Вернуться ко входу</a>
        </div>
    </main>

    <footer></footer>

    <script src="js/header.js" type="module"></script>
    <script src="js/footer.js" type="module"></script>
    <script>
        // js/reset-password.js – встроен прямо в HTML для надёжности
        (async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            
            const resetForm = document.getElementById('resetForm');
            const loadingIndicator = document.getElementById('loadingIndicator');
            const resetMessage = document.getElementById('resetMessage');
            
            if (!token) {
                showMessage('Неверная ссылка для восстановления', 'error');
                return;
            }
            
            // Проверяем токен
            loadingIndicator.style.display = 'block';
            
            try {
                const response = await fetch(`/api/reset-password.php?action=verify&token=${token}`);
                const data = await response.json();
                
                loadingIndicator.style.display = 'none';
                
                if (data.success) {
                    resetForm.style.display = 'block';
                    
                    resetForm.addEventListener('submit', async (e) => {
                        e.preventDefault();
                        
                        const newPassword = document.getElementById('newPassword').value;
                        const confirmPassword = document.getElementById('confirmPassword').value;
                        
                        resetMessage.style.display = 'none';
                        
                        if (newPassword !== confirmPassword) {
                            showMessage('Пароли не совпадают', 'error');
                            return;
                        }
                        
                        if (newPassword.length < 4) {
                            showMessage('Пароль должен содержать минимум 4 символа', 'error');
                            return;
                        }
                        
                        try {
                            const resetResponse = await fetch('/api/reset-password.php', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ action: 'reset', token: token, password: newPassword })
                            });
                            
                            const resetData = await resetResponse.json();
                            
                            if (resetData.success) {
                                showMessage('Пароль успешно изменён! Перенаправляем на страницу входа...', 'success');
                                
                                setTimeout(() => {
                                    window.location.href = '/account.html';
                                }, 3000);
                            } else {
                                showMessage(resetData.error, 'error');
                            }
                        } catch (err) {
                            console.error('Ошибка:', err);
                            showMessage('Сетевая ошибка. Попробуйте позже.', 'error');
                        }
                    });
                } else {
                    showMessage(data.error || 'Ссылка недействительна или истекла', 'error');
                }
            } catch (err) {
                console.error('Ошибка:', err);
                loadingIndicator.style.display = 'none';
                showMessage('Сетевая ошибка. Попробуйте позже.', 'error');
            }
            
            function showMessage(text, type) {
                resetMessage.textContent = text;
                resetMessage.className = `message ${type}`;
                resetMessage.style.display = 'block';
            }
        })();
    </script>
</body>
</html>
