<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель | Сладость веков</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-white: #ffffff;
            --color-red: #E60000;
            --color-yellow: #FFE8BA;
            --color-dark: #1A202C;
            --font-family-base: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family-base);
            background: #f5f5f5;
            min-height: 100vh;
        }

        .admin-container {
            display: flex;
            min-height: 100vh;
        }

        .admin-sidebar {
            width: 260px;
            background: var(--color-red);
            color: white;
            padding: 20px 0;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar-header {
            text-align: center;
            padding: 0 20px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            margin-bottom: 20px;
        }

        .sidebar-header h2 {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .sidebar-header p {
            font-size: 0.7rem;
            opacity: 0.8;
            margin-top: 5px;
        }

        .admin-sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            margin: 0;
            font-weight: 500;
            transition: background 0.2s;
            cursor: pointer;
        }

        .admin-sidebar a:hover {
            background: rgba(255,255,255,0.15);
        }

        .admin-sidebar a.active {
            background: rgba(255,255,255,0.25);
            font-weight: 600;
        }

        .admin-content {
            flex: 1;
            margin-left: 260px;
            padding: 20px 30px;
        }

        .admin-top-bar {
            background: white;
            padding: 15px 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #ddd;
        }

        .admin-page-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-dark);
        }

        .admin-user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-avatar {
            width: 35px;
            height: 35px;
            background: var(--color-red);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .admin-stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .admin-stat-card {
            background: white;
            padding: 20px;
            border: 1px solid #ddd;
        }

        .admin-stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--color-red);
        }

        .admin-stat-title {
            color: #666;
            font-size: 0.85rem;
            margin-top: 5px;
        }

        .admin-data-table {
            background: white;
            border: 1px solid #ddd;
        }

        .admin-data-table h3 {
            padding: 15px 20px;
            font-size: 1.2rem;
            font-weight: 600;
            border-bottom: 1px solid #ddd;
            background: #fafafa;
        }

        .admin-data-table table {
            width: 100%;
            border-collapse: collapse;
        }

        .admin-data-table th {
            background: #f5f5f5;
            padding: 12px 15px;
            text-align: left;
            font-weight: 600;
            border-bottom: 1px solid #ddd;
        }

        .admin-data-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }

        .admin-btn {
            background: var(--color-red);
            color: white;
            border: none;
            padding: 6px 14px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .admin-btn:hover {
            background: #b30000;
        }

        .admin-btn-sm {
            background: #ddd;
            color: #333;
            padding: 4px 10px;
            font-size: 0.7rem;
        }

        .admin-reports-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .admin-report-card {
            background: white;
            padding: 20px;
            border: 1px solid #ddd;
        }

        .admin-report-card h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ddd;
        }

        .admin-report-card table {
            width: 100%;
        }

        .admin-report-card td {
            padding: 6px 0;
        }

        .admin-edit-input, .admin-edit-select {
            width: 100%;
            padding: 5px;
            border: 1px solid #ddd;
            font-family: inherit;
        }

        .admin-save-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 4px 10px;
            cursor: pointer;
            margin-right: 5px;
        }

        .admin-edit-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 4px 10px;
            cursor: pointer;
            margin-right: 5px;
        }

        @media (max-width: 1000px) {
            .admin-stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .admin-reports-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .admin-sidebar {
                width: 200px;
            }
            .admin-content {
                margin-left: 200px;
            }
            .admin-stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <h2>Сладость веков</h2>
                <p>Админ-панель</p>
            </div>
            <a data-page="dashboard">Панель управления</a>
            <a data-page="reports">Отчёты</a>
            <a data-page="users">Пользователи</a>
            <a data-page="orders">Заказы</a>
            <a data-page="logout" style="margin-top: 40px;">Выход</a>
        </aside>
        
        <main class="admin-content"></main>
    </div>

    <script src="js/debug.js"></script>
</body>
</html>
