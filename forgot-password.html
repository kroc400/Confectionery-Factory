<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление пароля – Кондитерская фабрика</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .forgot-page .container {
            max-width: 500px;
            margin: 100px auto 40px;
            padding: 30px;
            background: white;
            border: 1px solid #ddd;
        }
        .forgot-page h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--color-dark);
        }
        .forgot-page input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
        }
        .forgot-page button {
            background: var(--color-red);
            color: white;
            border: none;
            padding: 12px 20px;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
        }
        .forgot-page button:hover {
            background: #b30000;
        }
        .message {
            padding: 10px;
            margin: 10px 0;
            border: 1px solid;
            display: none;
        }
        .message.success {
            background: #d1fae5;
            color: #059669;
            border-color: #059669;
        }
        .message.error {
            background: #fee2e2;
            color: #dc2626;
            border-color: #dc2626;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--color-red);
            font-size: 15px;
        }
    </style>
</head>
<body>
    <header></header>

    <main class="forgot-page">
        <div class="container">
            <h1>Восстановление пароля</h1>
            <p>Введите email, указанный при регистрации. Мы отправим ссылку для сброса пароля.</p>
            
            <div id="message" class="message"></div>
            
            <form id="forgotForm">
                <input type="email" id="resetEmail" placeholder="Email" required>
                <button type="submit">Отправить ссылку</button>
            </form>
            
            <a href="account.html" class="back-link">← Вернуться ко входу</a>
        </div>
    </main>

    <footer></footer>

    <script src="js/header.js" type="module"></script>
    <script src="js/footer.js" type="module"></script>
    <script src="js/forgot-password.js" type="module"></script>
</body>
</html>
