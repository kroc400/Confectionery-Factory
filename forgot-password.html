<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление пароля – Кондитерская фабрика</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .forgot-page .container {
            max-width: 500px;
            margin: 100px auto 40px;
            padding: 30px;
            background: white;
            border: 1px solid #ddd;
        }
        .forgot-page h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--color-dark);
        }
        .forgot-page p {
            margin-bottom: 20px;
            color: #666;
        }
        .forgot-page input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            font-family: inherit;
        }
        .forgot-page button {
            background: var(--color-red);
            color: white;
            border: none;
            padding: 12px 20px;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
            font-size: 1rem;
        }
        .forgot-page button:hover {
            background: #b30000;
        }
        .message {
            padding: 10px;
            margin: 10px 0;
            border: 1px solid;
            display: none;
        }
        .message.success {
            background: #d1fae5;
            color: #059669;
            border-color: #059669;
        }
        .message.error {
            background: #fee2e2;
            color: #dc2626;
            border-color: #dc2626;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--color-red);
            text-decoration: none;
            font-size: 15px;
        }
        .demo-link {
            margin-top: 15px;
            padding: 10px;
            background: #f0f0f0;
            font-size: 12px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <header></header>

    <main class="forgot-page">
        <div class="container">
            <h1>Восстановление пароля</h1>
            <p>Введите email, указанный при регистрации.</p>
            
            <div id="message" class="message"></div>
            
            <form id="forgotForm">
                <input type="email" id="resetEmail" placeholder="Email" required>
                <button type="submit">Отправить ссылку</button>
            </form>
            
            <a href="account.html" class="back-link">← Вернуться ко входу</a>
        </div>
    </main>

    <footer></footer>

    <script src="js/header.js" type="module"></script>
    <script src="js/footer.js" type="module"></script>
    <script>
        // js/forgot-password.js – встроен прямо в HTML
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('forgotForm');
            const messageDiv = document.getElementById('message');
            
            if (form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const email = document.getElementById('resetEmail').value;
                    
                    messageDiv.style.display = 'none';
                    messageDiv.className = 'message';
                    
                    try {
                        const response = await fetch('/api/reset-password.php', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: 'request', email: email })
                        });
                        
                        const data = await response.json();
                        
                        if (data.success) {
                            messageDiv.textContent = data.message;
                            messageDiv.className = 'message success';
                            messageDiv.style.display = 'block';
                            
                            form.reset();
                            
                            if (data.demo_link) {
                                const demoDiv = document.createElement('div');
                                demoDiv.className = 'demo-link';
                                demoDiv.innerHTML = `<strong>Тестовая ссылка:</strong><br><a href="${data.demo_link}" target="_blank">${data.demo_link}</a>`;
                                messageDiv.parentNode.appendChild(demoDiv);
                            }
                        } else {
                            messageDiv.textContent = data.error;
                            messageDiv.className = 'message error';
                            messageDiv.style.display = 'block';
                        }
                    } catch (err) {
                        console.error('Ошибка:', err);
                        messageDiv.textContent = 'Сетевая ошибка. Попробуйте позже.';
                        messageDiv.className = 'message error';
                        messageDiv.style.display = 'block';
                    }
                });
            }
        });
    </script>
</body>
</html>
