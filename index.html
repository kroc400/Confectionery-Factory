<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title></title>
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="/img/logo.png">
        </div>

        <div class="hd-right">
            <div class="hd-burger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </header>

    <div class="burger-menu">
        <div class="burger-container">
            <div class="burger-column">
                <ul>
                    <li><a href="#">История бренда</a></li>
                    <li><a href="#">Наша продукция</a></li>
                    <li><a href="#">Качество и ингредиенты</a></li>
                    <li><a href="#">Часто задаваемые вопросы</a></li>
                </ul>

                <div class="divic">Продукты, любимые с детства</div>
            </div>
        </div>
    </div>

    

    <main class="content">
<!-- #region banner -->
        <div class="slider-container">
            <div class="slider-track">
                <div class="slide">
                    <img src="./img/main-banner/main-banner.jfif">
                </div>
                <div class="slide">
                    <img src="./img/main-banner/slide2.jfif">
                </div>
                <div class="slide">
                    <img src="./img/main-banner/slide3.jfif">
                </div>
                <div class="slide">
                    <img src="./img/main-banner/slide4.jfif">
                </div>
                <div class="slide">
                    <img src="./img/main-banner/slide5.jfif">
                </div>
            </div>
            
            <button class="slider-btn prev-btn">❮</button>
            <button class="slider-btn next-btn">❯</button>
            
            <div class="slider-dots">
                <span class="dot active"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>
<!--#endregion -->

<!--#region brand info -->
        <section class="brand-info-section">
            <div class="brand-info-container">
                <div class="brand-info-left">
                    <H3>О бренде Сладость веков</H3>
                    <a href="#">Узнать больше</a> 
                </div>
                <div class="brand-info-right">
                    Основано в 1925 году. Одно из старейших кондитерских предприятий страны, где традиции мастерства воплощаются в каждом изделии.
                </div>
                   
            </div>
        </section>
<!--#endregion -->


    </main>
        
    <footer>
    </footer>

    <script src="backToTop.js"></script>
    <script src="imageSlider.js"></script>
    <script src="burger.js"></script>

</body>
</html>
